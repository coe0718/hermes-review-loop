name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # No dependencies to install: the plugin is stdlib-only on purpose, and so are its tests.
      - name: Compile every file
        run: python -m compileall -q review_loop scripts __init__.py
      - name: Loop tests (gates, budget, seats, watchdog, cleanup)
        run: python tests/run_tests.py
